name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Spec tests (timeline + 2/3/4-digit ring rule)
        run: ./gradlew :motion:desktopTest --stacktrace
      - name: Compile library for Android and desktop
        run: ./gradlew :motion:compileReleaseKotlinAndroid :motion:compileKotlinDesktop --stacktrace
      - name: Compile sample app
        run: ./gradlew :sample:compileKotlinDesktop --stacktrace
